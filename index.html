<style>
body{margin:0;background:#09090B}
a{color:#F4F4F5;text-decoration:none}a:hover{color:#FFFFFF}
.cab *{box-sizing:border-box}
.cab h1,.cab h2,.cab h3,.disp{font-family:'Bricolage Grotesque',Figtree,sans-serif}
.cab input,.cab select,.cab button{font-family:Figtree,sans-serif}
.dots{background-image:radial-gradient(rgba(255,255,255,0.09) 1px,transparent 1px);background-size:28px 28px;animation:drift 40s linear infinite}
.orb{filter:blur(90px);animation:orb 18s ease-in-out infinite}
.float1{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out 1.2s infinite}
.float3{animation:float 8s ease-in-out 2.4s infinite}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}
.track{animation:marquee 36s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.feat{transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,background .35s}
.feat:hover{transform:translateY(-6px);border-color:var(--accent);background:#141418}
.feat:hover .ficon{background:var(--accent);color:#0A0A0B}
.ficon{transition:background .35s,color .35s}
.btn{transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px -10px var(--accent)}
.ghost{transition:background .2s}
.ghost:hover{background:rgba(255,255,255,0.08)}
.opt{transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(255,255,255,0.4)}
.cab input:focus,.cab select:focus,.cab button:focus-visible,.cab a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cab details summary{list-style:none;cursor:pointer}
.cab details summary::-webkit-details-marker{display:none}
.cab details[open] .plus{transform:rotate(45deg)}
.plus{transition:transform .25s}
.motion-off *{animation:none !important}
@media (prefers-reduced-motion: reduce){.cab *{animation:none !important}}
@keyframes drift{from{background-position:0 0}to{background-position:280px 280px}}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.hc > div{justify-content:center}
.vsl-btn{transition:transform .25s}
#vsl-play:hover .vsl-btn{transform:scale(1.08)}
@media (max-width:640px){.vsl-btn{width:76px!important;height:76px!important}}
</style>

<style>html{scroll-behavior:smooth}</style>
</head>

<div style="border: 1px solid var(--accent); border-radius: 28px; padding: 36px; background: #111114">
<h3 style="margin: 0; font-size: 23px; font-weight: 600">Your own community app</h3>
<ul style="list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 16px; font-size: 16px; color: #E4E4E7">

<h2 style="margin: 16px 0 0; max-width: 740px; font-size: clamp(38px, 4.6vw, 64px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700">Everything below comes in the full build. No upsells.</h2>

class DCLogic{constructor(props){this.props=props||{};this.state={}}setState(p){Object.assign(this.state,p);render()}}

    const sizeOpts = mk('size', [

    ]);

    const next = () => {

const tpl=document.getElementById('tpl');const root=document.getElementById('root');const comp=new Component({accent:'#C8F135',motion:true});
function get(scope,expr){expr=expr.trim();if(expr==='true')return true;if(expr==='false')return false;return expr.split('.').reduce((o,k)=>o==null?undefined:o[k],scope)}
function interp(str,scope){const m=str.match(/^\s*\{\{([^}]+)\}\}\s*$/);if(m)return get(scope,m[1]);return str.replace(/\{\{([^}]+)\}\}/g,(_,e)=>{const v=get(scope,e);return v==null?'':v})}
function build(node,scope,out){
 if(node.nodeType===3){out.appendChild(document.createTextNode(interp(node.nodeValue,scope)));return}
 if(node.nodeType!==1)return;
 const tag=node.tagName.toLowerCase();
 if(tag==='sc-if'){if(interp(node.getAttribute('value'),scope))node.childNodes.forEach(c=>build(c,scope,out));return}
 if(tag==='sc-for'){const list=interp(node.getAttribute('list'),scope)||[];const as=node.getAttribute('as');list.forEach(it=>{const s=Object.create(scope);s[as]=it;node.childNodes.forEach(c=>build(c,s,out))});return}
 const el=node.namespaceURI==='http://www.w3.org/2000/svg'?document.createElementNS(node.namespaceURI,node.localName):document.createElement(node.localName);
 for(const a of node.attributes){const v=interp(a.value,scope);if(/^on/i.test(a.name)){if(typeof v==='function')el.addEventListener(a.name.slice(2).toLowerCase(),v)}else if(v!==false&&v!=null)el.setAttribute(a.name,v)}
 const kids=tag==='template'?node.content.childNodes:node.childNodes;kids.forEach(c=>build(c,scope,el));out.appendChild(el)}
const keep={};
function render(){
 // keep typed values
 root.querySelectorAll('input').forEach(i=>{if(i.id)keep[i.id]=i.value});
 const y=window.scrollY;const vals=comp.renderVals();const frag=document.createDocumentFragment();
 tpl.content.childNodes.forEach(c=>build(c,vals,frag));
 const vid=document.getElementById('vsl');const state=vid?{t:vid.currentTime,p:!vid.paused}:null;
 // keep hero (video) node stable: only replace the qualify section on rerender
 if(root.childNodes.length&&document.getElementById('qualify')){const nq=frag.querySelector?null:null;const tmp=document.createElement('div');tmp.appendChild(frag);const newQ=tmp.querySelector('#qualify');document.getElementById('qualify').replaceWith(newQ);}
 else{root.innerHTML='';root.appendChild(frag)}
 root.querySelectorAll('input').forEach(i=>{if(i.id&&keep[i.id]!=null)i.value=keep[i.id]});
 window.scrollTo(0,y);wire();
}
function wire(){
 const v=document.getElementById('vsl'),b=document.getElementById('vsl-play');
 if(v&&b&&!b.dataset.w){b.dataset.w=1;b.addEventListener('click',()=>{v.controls=true;v.play();b.style.display='none'});v.addEventListener('ended',()=>{document.getElementById('qualify')?.scrollIntoView({behavior:'smooth'})})}
 // result CTA: email answers
 document.querySelectorAll('#qualify a.btn').forEach(a=>{if(a.dataset.w)return;a.dataset.w=1;a.addEventListener('click',e=>{const s=comp.state;const g=id=>(document.getElementById(id)||{}).value||'';e.preventDefault();
  const body=`Build: ${s.build||''}\nBudget: ${s.budget||''}\nTimeline: ${s.timeline||''}\nCommunity type: ${s.type||''}\nCommunity size: ${s.size||''}\nName: ${g('q-name')}\nEmail: ${g('q-email')}\nPhone: ${g('q-phone')}\nLink: ${g('q-site')}`;
  window.location.href='mailto:hello@communityappbuilders.com?subject='+encodeURIComponent('Community app build: '+(g('q-name')||'new lead'))+'&body='+encodeURIComponent(body)})})
}
